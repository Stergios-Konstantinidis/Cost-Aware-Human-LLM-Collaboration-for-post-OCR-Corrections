<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" role="img" aria-label="OCR refinement pipeline">
  
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#e6f1ff"></stop>
    </linearGradient>
    <linearGradient id="boxGradAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6eaff"></stop>
      <stop offset="100%" stop-color="#9ec7ee"></stop>
    </linearGradient>
    <linearGradient id="boxGradSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#eef5fd"></stop>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#e9f2fc"></stop>
    </linearGradient>
    <linearGradient id="docGradMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f8fd"></stop>
      <stop offset="100%" stop-color="#d6e6f4"></stop>
    </linearGradient>
    <linearGradient id="docGradBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6eef7"></stop>
      <stop offset="100%" stop-color="#bdd2e8"></stop>
    </linearGradient>
    <linearGradient id="docGradFinal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#e2f3f0"></stop>
    </linearGradient>
    <linearGradient id="docGradFinalMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff8f6"></stop>
      <stop offset="100%" stop-color="#c6e6df"></stop>
    </linearGradient>
    <linearGradient id="docGradFinalBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceee9"></stop>
      <stop offset="100%" stop-color="#a4d2c9"></stop>
    </linearGradient>
    <linearGradient id="docFoldGradFinal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c3e3dc"></stop>
      <stop offset="100%" stop-color="#8ec5ba"></stop>
    </linearGradient>
    <linearGradient id="docFoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe2f7"></stop>
      <stop offset="100%" stop-color="#a9c8e8"></stop>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2"></feGaussianBlur>
      <feOffset dx="0" dy="3" result="off"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="softShadowSm" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8"></feGaussianBlur>
      <feOffset dx="0" dy="2" result="off"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <symbol id="doc" viewBox="0 0 64 80">
      <path d="M6 4 H44 L58 18 V74 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 V6 a2 2 0 0 1 2 -2 Z" fill="url(#docGrad)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M44 4 V16 a2 2 0 0 0 2 2 H58 Z" fill="url(#docFoldGrad)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
      <rect x="12" y="30" width="34" height="3" rx="1.5" fill="#9ec0e2"></rect>
      <rect x="12" y="40" width="40" height="3" rx="1.5" fill="#bcd4ec"></rect>
      <rect x="12" y="50" width="36" height="3" rx="1.5" fill="#bcd4ec"></rect>
      <rect x="12" y="60" width="28" height="3" rx="1.5" fill="#bcd4ec"></rect>
    </symbol>
    <symbol id="docMid" viewBox="0 0 64 80">
      <path d="M6 4 H44 L58 18 V74 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 V6 a2 2 0 0 1 2 -2 Z" fill="url(#docGradMid)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M44 4 V16 a2 2 0 0 0 2 2 H58 Z" fill="url(#docFoldGrad)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="docBack" viewBox="0 0 64 80">
      <path d="M6 4 H44 L58 18 V74 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 V6 a2 2 0 0 1 2 -2 Z" fill="url(#docGradBack)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M44 4 V16 a2 2 0 0 0 2 2 H58 Z" fill="#8fb1d2" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="docStack" viewBox="0 0 88 100">
      <use href="#docBack" x="20" y="0" width="64" height="80"></use>
      <use href="#docMid" x="10" y="10" width="64" height="80"></use>
      <use href="#doc" x="0" y="20" width="64" height="80"></use>
    </symbol>
    <symbol id="docFinal" viewBox="0 0 64 80">
      <path d="M6 4 H44 L58 18 V74 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 V6 a2 2 0 0 1 2 -2 Z" fill="url(#docGradFinal)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M44 4 V16 a2 2 0 0 0 2 2 H58 Z" fill="url(#docFoldGradFinal)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
      <rect x="12" y="30" width="34" height="3" rx="1.5" fill="#7fb8ad"></rect>
      <rect x="12" y="40" width="40" height="3" rx="1.5" fill="#a8d1c8"></rect>
      <rect x="12" y="50" width="36" height="3" rx="1.5" fill="#a8d1c8"></rect>
      <rect x="12" y="60" width="28" height="3" rx="1.5" fill="#a8d1c8"></rect>
    </symbol>
    <symbol id="docFinalMid" viewBox="0 0 64 80">
      <path d="M6 4 H44 L58 18 V74 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 V6 a2 2 0 0 1 2 -2 Z" fill="url(#docGradFinalMid)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M44 4 V16 a2 2 0 0 0 2 2 H58 Z" fill="url(#docFoldGradFinal)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="docFinalBack" viewBox="0 0 64 80">
      <path d="M6 4 H44 L58 18 V74 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 V6 a2 2 0 0 1 2 -2 Z" fill="url(#docGradFinalBack)" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M44 4 V16 a2 2 0 0 0 2 2 H58 Z" fill="#7eb3a8" stroke="#1a2438" stroke-width="2" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="docStackFinal" viewBox="0 0 88 100">
      <use href="#docFinalBack" x="20" y="0" width="64" height="80"></use>
      <use href="#docFinalMid" x="10" y="10" width="64" height="80"></use>
      <use href="#docFinal" x="0" y="20" width="64" height="80"></use>
    </symbol>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b82c4"></path>
    </marker>
  </defs>

  <rect width="1320" height="470" fill="#ffffff"></rect>

  <g filter="url(#softShadowSm)">
    <use href="#docStack" x="45" y="130" width="110" height="130"></use>
  </g>
  <text class="label" x="100" y="305" text-anchor="middle" font-size="20">Raw OCR</text>
  <text class="label" x="100" y="330" text-anchor="middle" font-size="20">Corpus</text>

  <line x1="160" y1="195" x2="245" y2="195" stroke="#3b82c4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHead)"></line>

  <g filter="url(#softShadow)">
    <rect x="255" y="120" width="230" height="160" rx="20" ry="20" fill="url(#boxGrad)" stroke="#1a2438" stroke-width="2.2"></rect>
  </g>
  <text class="box-title" x="370" y="170" text-anchor="middle" font-size="24">Machine</text>
  <text class="box-title" x="370" y="198" text-anchor="middle" font-size="24">Learning</text>
  <text class="box-title" x="370" y="226" text-anchor="middle" font-size="24">Model</text>
  <text class="box-sub" x="370" y="252" text-anchor="middle" font-size="14">Predicts benefit of</text>
  <text class="box-sub" x="370" y="269" text-anchor="middle" font-size="14">LLM-refinement</text>

  <line x1="492" y1="200" x2="588" y2="200" stroke="#3b82c4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHead)"></line>

  <g>
    <rect x="595" y="70" width="115" height="285" rx="28" ry="28" fill="#fbfdff" stroke="#3b82c4" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"></rect>
    <g filter="url(#softShadowSm)"><use href="#doc" x="626" y="85" width="52" height="65"></use></g>
    <g filter="url(#softShadowSm)"><use href="#doc" x="626" y="160" width="52" height="65"></use></g>
    <circle cx="652" cy="245" r="3.5" fill="#1a2438"></circle>
    <circle cx="652" cy="258" r="3.5" fill="#1a2438"></circle>
    <circle cx="652" cy="271" r="3.5" fill="#1a2438"></circle>
    <g filter="url(#softShadowSm)"><use href="#doc" x="626" y="282" width="52" height="65"></use></g>
  </g>
  <text class="label" x="652" y="385" text-anchor="middle" font-size="20">Sorted by</text>
  <text class="label" x="652" y="410" text-anchor="middle" font-size="20">Improvement</text>
  <text class="label" x="652" y="435" text-anchor="middle" font-size="20">Potential</text>

  <line x1="712" y1="210" x2="780" y2="210" stroke="#3b82c4" stroke-width="3" stroke-linecap="round"></line>
  <circle cx="780" cy="210" r="4.5" fill="#3b82c4"></circle>
  <path d="M 780 210 C 830 210, 800 115, 862 115" stroke="#3b82c4" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrowHead)"></path>
  <path d="M 780 210 C 830 210, 800 290, 862 290" stroke="#3b82c4" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrowHead)"></path>
  <text class="label sub" x="965" y="32" text-anchor="middle" font-size="13">predicted to improve</text>
  <text class="label sub" x="965" y="48" text-anchor="middle" font-size="13">text quality</text>
  <text class="label sub" x="965" y="365" text-anchor="middle" font-size="13">predicted to degrade</text>
  <text class="label sub" x="965" y="381" text-anchor="middle" font-size="13">text quality</text>

  <g filter="url(#softShadow)">
    <rect x="865" y="60" width="200" height="110" rx="18" ry="18" fill="url(#boxGradAccent)" stroke="#1a2438" stroke-width="2.2"></rect>
  </g>
  <text class="box-title" x="965" y="105" text-anchor="middle" font-size="22">LLM</text>
  <text class="box-title" x="965" y="135" text-anchor="middle" font-size="22">Correction</text>

  <g filter="url(#softShadow)">
    <rect x="865" y="235" width="200" height="110" rx="18" ry="18" fill="url(#boxGradSoft)" stroke="#1a2438" stroke-width="2.2"></rect>
  </g>
  <text class="box-title" x="965" y="270" text-anchor="middle" font-size="20">Keep</text>
  <text class="box-title" x="965" y="295" text-anchor="middle" font-size="20">Original</text>
  <text class="box-title" x="965" y="320" text-anchor="middle" font-size="20">Text</text>

  <path d="M 1065 115 C 1105 115, 1115 200, 1140 200" stroke="#3b82c4" stroke-width="3" fill="none" stroke-linecap="round"></path>
  <path d="M 1065 290 C 1105 290, 1115 200, 1140 200" stroke="#3b82c4" stroke-width="3" fill="none" stroke-linecap="round"></path>
  <line x1="1140" y1="200" x2="1195" y2="200" stroke="#3b82c4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHead)"></line>

  <g filter="url(#softShadowSm)">
    <use href="#docStackFinal" x="1200" y="140" width="110" height="130"></use>
  </g>
  <text class="label" x="1255" y="305" text-anchor="middle" font-size="20">Final</text>
  <text class="label" x="1255" y="330" text-anchor="middle" font-size="20">Corrected</text>
  <text class="label" x="1255" y="355" text-anchor="middle" font-size="20">Corpus</text>
</svg>